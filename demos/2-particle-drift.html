<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo: Particle Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121014; width: 100%; height: 100vh; overflow: hidden; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .content {
    position: relative; z-index: 1;
    color: #f0f0f0; font-family: sans-serif;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; text-align: center;
  }
  h1 { font-size: 3rem; font-weight: 300; letter-spacing: 0.05em; }
  p { margin-top: 1rem; color: #a0a0a0; font-size: 1.1rem; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <div>
    <h1>Particle Drift</h1>
    <p>Sparse floating dots like distant stars</p>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COUNT = 80;
const particles = Array.from({ length: COUNT }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.5 + 0.5,
  vx: (Math.random() - 0.5) * 0.15,
  vy: -Math.random() * 0.2 - 0.05,
  alpha: Math.random() * 0.4 + 0.1
}));

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;

    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
    if (p.x < -10) p.x = canvas.width + 10;
    if (p.x > canvas.width + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 200, 210, ${p.alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
